    <rect x="172" y="84" width="68" height="44" rx="8"/>
    <rect x="256" y="84" width="68" height="44" rx="8"/>
    <rect x="340" y="84" width="84" height="44" rx="8"/>
    <rect x="88" y="144" width="68" height="44" rx="8"/>
    <rect x="340" y="144" width="84" height="44" rx="8"/>
    <rect x="88" y="204" width="68" height="44" rx="8"/>
  </g>
  <!-- Gold Trigger Core -->
  <g fill="url(#gold)">
    <rect x="172" y="144" width="152" height="44" rx="8"/>
    <rect x="172" y="204" width="68" height="44" rx="8"/>
    <rect x="256" y="204" width="68" height="44" rx="8"/>
  </g>
  <!-- Cascade Balls -->
  <circle cx="372" cy="244" r="18" fill="#ffffff"/>
  <circle cx="312" cy="296" r="16" fill="#22d3ee"/>
  <circle cx="224" cy="310" r="18" fill="#facc15"/>
