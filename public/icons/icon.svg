      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f26a3d"/>
      <stop offset="100%" stop-color="#e11922"/>
